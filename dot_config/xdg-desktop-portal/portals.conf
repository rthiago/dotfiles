# xdg-desktop-portal backend selection for i3 (X11). Several backends are
# installed (gtk, gnome, hyprland); with XDG_CURRENT_DESKTOP=i3 the portal has no
# default and fails to activate, which is why flameshot reports it cannot locate
# org.freedesktop.portal.Desktop. Pin gtk: it provides the base portal service
# and the Settings interface (color-scheme -> libadwaita dark).
[preferred]
default=gtk
