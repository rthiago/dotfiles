# picom v13. Trimmed to active settings; `man picom` has the full option list.
# i3 restarts picom on reload via exec_always in ~/.config/i3/config.

# ── Shadows ───────────────────────────────────────────────────────────────────
shadow = true;
shadow-color = "#1a1a1a";
shadow-radius = 18;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@",
  "name = 'cpt_frame_window'",
  "class_g ?= 'zoom'"
];

# ── Rounded corners ───────────────────────────────────────────────────────────
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'i3bar'"
];

# ── Animations ────────────────────────────────────────────────────────────────
# open/close = new/destroyed windows (rofi, dialogs); show/hide = scratchpad
# toggles and workspace switches. The `geometry` trigger (animating tiling
# moves/resizes) is experimental upstream — left out on purpose. Animations
# can't be scoped by the old *-exclude options; exempting windows (e.g. menus)
# requires migrating to the v12+ `rules` system.
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    duration = 0.15; scale = 0.95; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.10; scale = 0.95; }
);

# ── Fading ────────────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 7;

# ── Opacity ───────────────────────────────────────────────────────────────────
inactive-opacity = 1;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;
inactive-dim = 0;
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'zoom'"
];
opacity-rule = [
  "90:class_g = 'com.mitchellh.ghostty'"
];

# ── Background blur ───────────────────────────────────────────────────────────
blur-method = "dual_kawase";
blur-strength = 3;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@",
  "class_g = 'zoom'",
  "class_g = 'Gnome-screenshot'"
];

# ── General ───────────────────────────────────────────────────────────────────
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.8; }
  dropdown_menu = { opacity = 0.8; }
};
